<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Login - Burung Ngapung</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; }
        .login-box h2 { text-align: center; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Login Pemain</h2>
        <!-- Form Login -->
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username:</label>
                <input type="text" id="username" required placeholder="Masukkan nama...">
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required placeholder="Masukkan password...">
            </div>
            <button type="submit">Masuk ke Game</button>
        </form>
    </div>

    <!-- Script JavaScript untuk Logika Login -->
    <script>
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault(); // Mencegah halaman mereload otomatis

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Contoh validasi sederhana (bisa Anda sesuaikan)
            // Misal: username "admin" dan password "12345"
            if (user === "admin" && pass === "12345") {
                alert("Login Berhasil! Selamat datang, " + user);
                
                // Arahkan ke halaman game utama Anda (misal: index.html)
                window.location.href = "index.html"; 
            } else {
                alert("Username atau Password salah!");
            }
        });
    </script>

</body>
</html>
