<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Burung Ngapung Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #70c5ce; /* Warna latar khas game burung */
            text-align: center;
        }
        /* Tombol Log Out di pojok kanan atas */
        #logoutBtn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            z-index: 999;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        #logoutBtn:hover { background: #c82333; }
        
        .game-container {
            margin-top: 100px;
        }
    </style>
</head>
<body>

    <!-- Tombol Log Out -->
    <button id="logoutBtn">Log Out</button>

    <div class="game-container">
        <h1>🎮 Game Burung Ngapung</h1>
        <p>Selamat datang, <span id="welcomeUser" style="font-weight: bold; color: #fff;"></span>!</p>
        <!-- Tempat elemen game utama Anda (Canvas/Script game) berada di sini -->
    </div>

    <script>
        // 1. Cek Keamanan: Apakah pengguna sudah login?
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert("Anda harus login terlebih dahulu!");
            window.location.href = "login.html"; // Tendang balik ke halaman login jika belum login
        } else {
            // Tampilkan nama user yang sedang login
            const activeUser = localStorage.getItem('username');
            document.getElementById('welcomeUser').textContent = activeUser;
        }

        // 2. Logika Tombol Log Out
        const logoutBtn = document.getElementById('logoutBtn');
        logoutBtn.addEventListener('click', function() {
            let konfirmasi = confirm("Apakah Anda yakin ingin keluar dari game?");
            if (konfirmasi) {
                // Hapus data sesi login dari browser
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('username');
                
                // Kembalikan ke halaman login
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
